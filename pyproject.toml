[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aliyun_controller"
version = "0.2.0"
description = "A Textual TUI for managing Alibaba Cloud services including billing queries and DNS management"
readme = "README.md"
authors = [
    {name = "Moha-Master", email = "hongkongreporter@outlook.com"},
]
license = "MIT"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.10"
dependencies = [
    "alibabacloud-ecs20140526",
    "alibabacloud-bssopenapi20171214",
    "alibabacloud-alidns20150109",
    "textual>=8.0",
    "PyYAML",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-asyncio",
]

[project.urls]
Homepage = "https://github.com/Moha-Master/Aliyun-Controller"
Repository = "https://github.com/Moha-Master/Aliyun-Controller.git"
GitHub = "https://github.com/Moha-Master/Aliyun-Controller"
Issues = "https://github.com/Moha-Master/Aliyun-Controller/issues"

[project.scripts]
aliyunctl = "aliyun_controller.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["aliyun_controller*"]
exclude = ["tests*", "venv*"]

[tool.setuptools.package-dir]
"" = "."

[tool.setuptools.package-data]
aliyun_controller = ["*.tcss"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["E501"]
